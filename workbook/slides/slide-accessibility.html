<script>
  (() => {
    const enhanceSlides = () => {
      const deckTitle =
        document.querySelector('meta[name="title"]')?.getAttribute("content") ||
        document.title ||
        "MB 360 slide deck";
      const slides = document.querySelector(".reveal .slides");

      if (slides) {
        slides.id = "slide-content";
        slides.setAttribute("role", "region");
        slides.setAttribute("aria-label", `${deckTitle} slide deck`);
      }

      const controls = document.querySelector(".reveal .controls");
      if (controls) {
        controls.setAttribute("aria-label", "Slide navigation controls");
      }

      document.querySelectorAll(".slide-menu-button a:not([aria-label])").forEach((link) => {
        link.setAttribute("aria-label", "Open slide menu");
      });

      // Reveal disables pinch-zoom by default; re-enable it for low-vision users.
      const viewport = document.querySelector('meta[name="viewport"]');
      if (viewport && /user-scalable=no/.test(viewport.getAttribute("content") || "")) {
        viewport.setAttribute("content", "width=device-width, initial-scale=1.0");
      }

      document.querySelectorAll(".reveal .slide-number, .reveal .slide-logo").forEach((node) => {
        node.setAttribute("aria-hidden", "true");
        if (node.tagName === "IMG") {
          node.setAttribute("alt", "");
          node.setAttribute("role", "presentation");
        }
        node.querySelectorAll?.("img").forEach((image) => {
          image.setAttribute("alt", "");
          image.setAttribute("role", "presentation");
        });
      });
    };

    enhanceSlides();
    if (window.Reveal && typeof window.Reveal.on === "function") {
      window.Reveal.on("ready", enhanceSlides);
    }

    const observer = new MutationObserver(() => {
      enhanceSlides();
      if (document.querySelector(".reveal .controls") && document.querySelector(".reveal .slide-logo") && document.querySelector(".slide-menu-button a[aria-label]")) {
        observer.disconnect();
      }
    });

    observer.observe(document.body, { childList: true, subtree: true });
  })();
</script>
